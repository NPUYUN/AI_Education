task unzipSherpaLibs(dependsOn: downloadSherpaLibs, type: Copy) {
    def destDir = new File(buildDir, 'downloads')
    from tarTree(resources.bzip2(new File(destDir, 'sherpa-libs.tar.bz2')))
    into new File(buildDir, 'sherpa-libs-extracted')
}

task installSherpaLibs(dependsOn: unzipSherpaLibs, type: Copy) {
    // Source path depends on the structure inside the tar
    // Based on LS output, it seems to be directly under jniLibs
    def sourceDir = new File(buildDir, 'sherpa-libs-extracted/jniLibs')
    if (!sourceDir.exists()) {
        // Fallback to checking for the versioned folder just in case
        sourceDir = new File(buildDir, 'sherpa-libs-extracted/sherpa-onnx-v1.10.30-android/jniLibs')
    }
    
    from sourceDir
    into "src/main/jniLibs"
}

task unzipSherpaModel(dependsOn: downloadSherpaModel, type: Copy) {
    def destDir = new File(buildDir, 'downloads')
    from tarTree(resources.bzip2(new File(destDir, 'sherpa-model.tar.bz2')))
    into "src/main/assets"
}

// Hook into preBuild
preBuild.dependsOn installSherpaLibs, unzipSherpaModel
